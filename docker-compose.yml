version: '3.8'

services:
  app:
    build: .
    container_name: cross-border-payment-assistant
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    restart: unless-stopped
    environment:
      - NODE_ENV=production

